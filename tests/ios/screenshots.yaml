# The screens scripts/ios-screenshots.sh saves from the iPhone app, with
# Maestro (https://maestro.dev). LOOK is "light" or "dark", for the names.
appId: com.shaadi24.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in or create account"
    timeout: 60000
# Apple's and Google's buttons appear once Supabase has said they're on
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${LOOK}-1-welcome
- tapOn: "Sign in or create account"
- extendedWaitUntil:
    visible: "Continue with Email"
    timeout: 20000
- takeScreenshot: ${LOOK}-2-sign-in
- tapOn: "Continue with Email"
- extendedWaitUntil:
    visible: "Log In"
    timeout: 20000
- takeScreenshot: ${LOOK}-3-email
