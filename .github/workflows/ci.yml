# Every pull request and every push to main: the app's code type-checks, passes
# the linter and builds, and the server's unit tests pass. The browser tests (tests/e2e)
# need a local Supabase and run by hand (tests/e2e/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Type check, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  functions:
    name: Server unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.x
      - run: deno test --no-config --node-modules-dir=none --allow-env --allow-read supabase/functions/
